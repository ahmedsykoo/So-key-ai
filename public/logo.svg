<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="sGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D2FF"/>
      <stop offset="50%" stop-color="#3A7BD5"/>
      <stop offset="100%" stop-color="#F38F49"/>
    </linearGradient>
    <linearGradient id="keyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#F97316"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="256" cy="256" r="220" fill="#081017" />
  
  <!-- Outer Stylized S Curve -->
  <path d="M 330,120 C 230,80 140,140 140,230 C 140,300 200,320 270,340 C 340,360 380,400 350,450 C 320,490 190,470 120,420" 
        fill="none" stroke="url(#sGrad)" stroke-width="48" stroke-linecap="round" filter="url(#glow)"/>

  <!-- Center Key Element -->
  <g transform="translate(180, 180) rotate(-35 80 80)">
    <!-- Key Ring -->
    <circle cx="50" cy="50" r="35" fill="none" stroke="url(#keyGrad)" stroke-width="22" filter="url(#glow)"/>
    <!-- Key Shaft -->
    <rect x="75" y="40" width="100" height="20" rx="6" fill="url(#keyGrad)" filter="url(#glow)"/>
    <!-- Key Teeth -->
    <rect x="140" y="60" width="16" height="24" rx="3" fill="url(#keyGrad)"/>
    <rect x="162" y="60" width="16" height="30" rx="3" fill="url(#keyGrad)"/>
  </g>

  <!-- Sparkle Star -->
  <path d="M 390,130 Q 390,160 420,160 Q 390,160 390,190 Q 390,160 360,160 Q 390,160 390,130 Z" fill="#38BDF8" filter="url(#glow)"/>
</svg>
